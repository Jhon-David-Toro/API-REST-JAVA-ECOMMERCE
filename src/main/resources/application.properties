app.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.storage.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.storage.cloudinary.root-folder=shop-api

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.application.name=ecommerce-api

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.seed.admin-name=${ADMIN_NAME:Store Admin}
app.seed.admin-email=${ADMIN_EMAIL:}
app.seed.admin-password=${ADMIN_PASSWORD:}
